body { background: var(--ds-page); }

/* ---------- velvet stage ---------- */
.invite-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 0 8px;
}

.velvet .frame {
    width: 100%;
    max-width: 480px;
    padding: 14px;
    border-radius: 14px;
    background:
        radial-gradient(120% 90% at 50% 0%, rgba(255, 238, 200, 0.10) 0%, transparent 55%),
        radial-gradient(140% 120% at 50% 110%, rgba(20, 32, 18, 0.55) 0%, transparent 60%),
        linear-gradient(155deg, #44543a 0%, #33402c 48%, #2a3524 100%);
    box-shadow:
        inset 0 1px 0 rgba(255, 240, 205, 0.22),
        inset 0 -14px 30px rgba(16, 24, 13, 0.45),
        0 24px 48px rgba(50, 60, 42, 0.35);
}

.frame::before {
    content: '';
    display: block;
    position: absolute;
}

.doors {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    perspective: 1600px;
    border-radius: 8px;
    outline: 1px solid rgba(201, 168, 106, 0.85);
    outline-offset: 6px;
}

.card-behind {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 20px 44px rgba(20, 30, 16, 0.5);
}

.door {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50.06%;
    background-image: url('3-cover.jpg');
    background-size: 200% 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.55s;
    box-shadow: 0 20px 44px rgba(20, 30, 16, 0.4);
    z-index: 2;
}
.door::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(255, 240, 205, 0.10) 0%, transparent 30%, rgba(20, 30, 16, 0.16) 100%);
}
.door-left {
    left: 0;
    background-position: left center;
    transform-origin: left center;
    border-radius: 8px 0 0 8px;
}
.door-right {
    right: 0;
    background-position: right center;
    transform-origin: right center;
    border-radius: 0 8px 8px 0;
}

.is-opening .door-left { transform: rotateY(-104deg); }
.is-opening .door-right { transform: rotateY(104deg); }

.is-opening .door-left,
.is-opening .door-right {
    animation: doorGone 0.4s ease 2.05s forwards;
}
@keyframes doorGone { to { opacity: 0; } }

/* ---------- wax seal ---------- */
.seal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fdf7e7;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 16px;
    letter-spacing: 0.5px;
    background:
        radial-gradient(circle at 32% 28%, #eecd92 0%, #c9a86a 40%, #a5813f 76%, #84662c 100%);
    box-shadow:
        0 6px 18px rgba(40, 32, 12, 0.55),
        inset 0 2px 4px rgba(255, 244, 214, 0.6),
        inset 0 -3px 6px rgba(90, 66, 24, 0.55);
    animation: sealPulse 2.2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
}
.seal::before {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    border: 1.5px solid rgba(253, 247, 231, 0.65);
}
.seal-mono { position: relative; z-index: 2; text-shadow: 0 1px 2px rgba(90, 66, 24, 0.7); }
.seal-half {
    position: absolute;
    top: 0; bottom: 0;
    width: 50.5%;
    z-index: 1;
    opacity: 0;
}

@keyframes sealPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
}

.is-opening .seal {
    animation: sealBreak 0.55s cubic-bezier(0.55, 0, 0.55, 1) forwards;
}
@keyframes sealBreak {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: brightness(1); }
    30% { transform: translate(-50%, -50%) scale(1.16) rotate(-5deg); opacity: 1; filter: brightness(1.35); }
    100% { transform: translate(-50%, -50%) scale(0.15) rotate(16deg); opacity: 0; filter: brightness(1.6); }
}

/* sparkle burst when the seal cracks */
.spark {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe9b0 0%, #d9b36a 70%, transparent 100%);
    box-shadow: 0 0 8px 2px rgba(233, 205, 146, 0.8);
    z-index: 5;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: sparkFly 0.9s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
    pointer-events: none;
}
@keyframes sparkFly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(1.1); }
}

.tap-hint {
    margin: 18px 0 0;
    color: var(--ds-ink-2);
    font-size: 14px;
    text-align: center;
    animation: hintFade 2.2s ease-in-out infinite;
}
@keyframes hintFade { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
.is-opening .tap-hint { animation: none; opacity: 0; transition: opacity 0.3s; }

/* ---------- open view ---------- */
.invite-open {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 18px 2px 4px;
    overflow: hidden;
}

.names {
    width: min(320px, 82%);
    height: auto;
    z-index: 2;
}
.names-draw {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 40px;
    fill: #8a6a30;
    fill-opacity: 0;
    stroke: #b08d57;
    stroke-width: 0.8;
    stroke-dasharray: 480;
    stroke-dashoffset: 480;
    animation:
        nameStroke 2.4s ease-in-out 0.25s forwards,
        nameFill 1.2s ease 1.9s forwards;
}
@keyframes nameStroke { to { stroke-dashoffset: 0; } }
@keyframes nameFill { to { fill-opacity: 1; } }
.names-line {
    fill: none;
    stroke: #c9a86a;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-dasharray: 240;
    stroke-dashoffset: 240;
    animation: nameStroke 1.1s ease-out 2.5s forwards;
}

.card-full {
    width: 100%;
    max-width: 460px;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 22px 48px rgba(66, 78, 58, 0.32);
    animation: cardReveal 0.9s cubic-bezier(0.22, 0.8, 0.3, 1) 0.35s both;
    z-index: 1;
}
@keyframes cardReveal {
    0% { opacity: 0; transform: translateY(26px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* rose petals */
.petal {
    position: absolute;
    z-index: 3;
    border-radius: 62% 38% 60% 40% / 48% 62% 38% 52%;
    background: radial-gradient(circle at 30% 25%, #e8b4b4 0%, #b03a44 45%, #7c1d26 100%);
    box-shadow: inset -2px -3px 5px rgba(120, 40, 45, 0.35);
    opacity: 0;
    pointer-events: none;
    animation: petalFall linear infinite;
}
@keyframes petalFall {
    0% { opacity: 0; transform: translate3d(0, -40px, 0) rotate(0deg); }
    6% { opacity: 0.9; }
    50% { transform: translate3d(var(--drift), 100px, 0) rotate(calc(var(--spin) * 0.5)); }
    94% { opacity: 0.85; }
    100% { opacity: 0; transform: translate3d(calc(var(--drift) * -0.4), 200px, 0) rotate(var(--spin)); }
}

/* January 2027 section */
.majlis {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin: 6px 0 0;
    text-align: center;
    z-index: 2;
}
.majlis-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a86a, transparent);
    margin: 6px 0;
}
.majlis-title {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 22px;
    color: #8a6a30;
}
.majlis-sub {
    margin: 0;
    font-size: 16px;
    letter-spacing: 0.4px;
    color: var(--ds-ink);
}
.majlis-date {
    margin: 2px 0 0;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ds-ink-2);
}

.venue-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
    text-align: center;
}
.venue-name { color: #6d5326; font-size: 14px; }
/* venue button */
.venue {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: 999px;
    border: 1px solid #c9a86a;
    color: #6d5326;
    background: linear-gradient(180deg, rgba(233, 205, 146, 0.22), rgba(201, 168, 106, 0.12));
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(120, 96, 40, 0.16);
    z-index: 2;
    min-height: 44px;
}
.venue-pin { color: #b04f52; font-size: 15px; }
.venue:active { transform: scale(0.97); }

.replay { align-self: center; }


/* mubarak button */
.mubarak {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 10px 0 2px;
    text-align: center;
    z-index: 2;
}
.mubarak-title {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 19px;
    color: #8a6a30;
}
.mubarak-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid #a8853f;
    background: linear-gradient(180deg, #e6c987, #c9a050);
    color: #3d2c10;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(120, 96, 40, 0.28);
    min-height: 44px;
}
.mubarak-heart { color: #9c2b2e; font-size: 16px; }
.mubarak-btn:active { transform: scale(0.96); }
.mubarak-note {
    margin: 0;
    max-width: 290px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ds-ink-2);
}

/* music toggle */
.music-fab {
    position: fixed;
    right: 16px;
    bottom: 18px;
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid #c9a86a;
    cursor: pointer;
    font-size: 19px;
    color: #fdf7e7;
    background: linear-gradient(160deg, #b08d57, #8a6a30);
    box-shadow: 0 6px 16px rgba(60, 48, 20, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}
.music-fab::after {
    content: '';
    position: absolute;
    left: 8px;
    top: 50%;
    width: 30px;
    height: 2px;
    background: #fdf7e7;
    transform: rotate(-38deg);
    transform-origin: center;
    opacity: 1;
    transition: opacity 0.2s;
}
.music-fab.is-on::after { opacity: 0; }
.music-fab.is-on { animation: fabPulse 2.4s ease-in-out infinite; }
@keyframes fabPulse {
    0%, 100% { box-shadow: 0 6px 16px rgba(60, 48, 20, 0.4); }
    50% { box-shadow: 0 6px 20px rgba(60, 48, 20, 0.4), 0 0 0 7px rgba(201, 168, 106, 0.18); }
}

@media (prefers-reduced-motion: reduce) {
    .seal, .tap-hint, .petal, .music-fab.is-on { animation: none; }
    .petal { display: block; opacity: 0.65; transform: rotate(22deg); }
    .card-full, .names-draw, .names-line { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    .door { transition: none; }
}

/* hidden background madeh player */
.yt-hidden {
    position: absolute;
    width: 2px;
    height: 2px;
    left: -10px;
    top: -10px;
    opacity: 0.01;
    border: 0;
    pointer-events: none;
}

/* soft gold wash + pinstripes behind the open view, like the reference */
.velvet-open::before {
    content: '';
    position: absolute;
    inset: -20px -24px;
    z-index: 0;
    background:
        radial-gradient(60% 22% at 50% 0%, rgba(201, 168, 106, 0.16) 0%, transparent 70%),
        radial-gradient(60% 26% at 50% 100%, rgba(201, 168, 106, 0.14) 0%, transparent 70%),
        repeating-linear-gradient(90deg, transparent 0 46px, rgba(201, 168, 106, 0.08) 46px 47px);
    pointer-events: none;
}

:root { --ds-page:#f7f4ed; --ds-ink:#342d20; --ds-ink-2:#706a5e; } [hidden]{display:none!important} body { font: 16px/1.5 system-ui, sans-serif; color:var(--ds-ink); } .file-card { width:min(100%,520px); margin: 0 auto; padding: 16px 16px 34px; background:#faf7f0; min-height:100vh; } .closing { margin:20px auto 0; text-align:center; color:var(--ds-ink-2); font: italic 14px/1.5 Georgia,serif; max-width:400px; }.caption { text-align:center; color:var(--ds-ink-2); font-size:13px; margin:2px auto 0; max-width:430px; }.file-button { padding:10px 18px; border-radius:20px; border:1px solid #c9a86a; background:#f5eddd; color:#6d5326; cursor:pointer; }.invite-stage { padding-top:16px; }.velvet .frame { width:100%; }

<div style="position:absolute;bottom:16px;left:0;right:0"><p style="margin:0;font:italic 20px Georgia,serif;color:#e6c987">Mubarak</p><p style="margin:4px 0 0;font:12px Georgia,serif;letter-spacing:3px">SARAH &#10084; HATIM</p></div></section><img class="card-full" src="2-card.jpg" alt="Wedding invitation of Sarah, daughter of Adnan Hussain and Nisreen Hussain, and Hatim, son of Raika Ben and Qutbuddin Bhai Sheopurwala (Indore). Khushi ni Majlis and Dinner, January 2027, Saifee Masjid, Mandwa Road, Dharni."><div class="majlis"><span class="majlis-rule"></span><p class="majlis-title">Insha Allah</p><p class="majlis-sub">Khushi ni Majlis &amp; Dinner</p><p class="majlis-date">January 2027</p><span class="majlis-rule"></span></div><div class="venue-wrap"><span class="venue-name">Saifee Masjid, Mandwa Road, Dharni</span><a class="venue" href="https://www.google.com/maps/search/?api=1&amp;query=Saifee+Masjid%2C+Dharni+%28Dawoodi+Bohra%29&amp;query_place_id=ChIJ7d1MPOq81zsRJvKyPZ0kLKA" target="_blank" rel="noreferrer" aria-label="Directions to Saifee Masjid, Dharni"><span class="venue-pin" aria-hidden="true">❦</span><span>Directions</span></a></div><div class="mubarak"><span class="majlis-rule"></span><a class="mubarak-btn" href="https://wa.me/919022150546?text=Sarah+aur+Hatim+ko+shaadi+ki+dher+saari+mubarakbaad%21+%E2%9D%A4%EF%B8%8F+Aapka+invitation+mil+gaya." target="_blank" rel="noreferrer"><span class="mubarak-heart">❤</span><span>Mubarak send</span></a><span class="majlis-rule"></span></div><button type="button" class="file-button is-compact replay" id="replay">Watch the opening again</button></div><button type="button" class="music-fab" id="music" aria-label="Play music" aria-pressed="false">♫</button><p class="closing">With blessings of Mr. Adnan Hussain, Mrs. Nisreen Hussain &amp; family.</p></main><script>const stage=document.getElementById('stage'), invite=document.getElementById('invite'), music=document.getElementById('music'); let ctx, buffer, source, gain, opening=false, timer; const audioUrl='5-madeh.mp3';
for(let i=0;i<14;i++){const p=document.createElement('span'); p.className='petal';Object.assign(p.style,{left:`${(i*31.7+7)%92+4}%`,top:`${(i*29.3+4)%92}%`,width:`${9+i%4*4}px`,height:`${(9+i%4*4)*1.25}px`,animationDuration:`${10+i%5*2.4}s`,animationDelay:`${-((i*1.83)%12)}s`});p.style.setProperty('--drift',`${24+i%3*18}px`);p.style.setProperty('--spin',`${200+i%5*90}deg`);document.getElementById('petals').append(p)}
function markMusic(on){music.classList.toggle('is-on',on);music.setAttribute('aria-label',on?'Mute music':'Play music');music.setAttribute('aria-pressed',String(on))}
function startMusic(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx ||= new AC();if(ctx.state==='suspended')ctx.resume().catch(()=>{});const start=b=>{if(source)return;gain=ctx.createGain();gain.gain.value=0;gain.connect(ctx.destination);source=ctx.createBufferSource();source.buffer=b;source.loop=true;source.connect(gain);source.start();gain.gain.setValueAtTime(0,ctx.currentTime);gain.gain.linearRampToValueAtTime(.85,ctx.currentTime+2.4);markMusic(true)};if(buffer){start(buffer);return}fetch(audioUrl).then(r=>{if(!r.ok)throw Error('Audio unavailable');return r.arrayBuffer()}).then(bytes=>ctx.decodeAudioData(bytes)).then(b=>{buffer=b;start(b)}).catch(()=>markMusic(false))}catch{markMusic(false)}}
document.getElementById('open').addEventListener('click',()=>{if(opening)return;opening=true;startMusic();const show=()=>{stage.hidden=true;invite.hidden=false};if(matchMedia('(prefers-reduced-motion: reduce)').matches){show();return}stage.classList.add('is-opening');const doors=stage.querySelector('.doors');for(let i=0;i<10;i++){let s=document.createElement('span');s.className='spark';const a=i/10*Math.PI*2,d=46+i%3*16,z=3+i%3*2;Object.assign(s.style,{width:`${z}px`,height:`${z}px`,animationDelay:`${.28+i%4*.05}s`});s.style.setProperty('--sx',`${Math.cos(a)*d}px`);s.style.setProperty('--sy',`${Math.sin(a)*d}px`);doors.append(s)}timer=setTimeout(show,2700)});
document.getElementById('replay').addEventListener('click',()=>{clearTimeout(timer);opening=false;invite.hidden=true;stage.hidden=false;stage.classList.remove('is-opening');stage.querySelectorAll('.spark').forEach(s=>s.remove())});music.addEventListener('click',()=>{if(!ctx){startMusic();return}if(ctx.state==='running')ctx.suspend().then(()=>markMusic(false)).catch(()=>{});else ctx.resume().then(()=>markMusic(true)).catch(()=>{})});</script></body></html>
